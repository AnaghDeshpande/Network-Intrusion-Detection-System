<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIDS Prediction Form</title>
  <style>
    /* General body styling */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0077b6;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
      background-color: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #023e8a;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #0077b6;
      box-shadow: 0 0 5px rgba(0, 119, 182, 0.3);
      outline: none;
    }

    button {
      grid-column: span 3;
      padding: 12px;
      background-color: #0077b6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    p {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      margin-top: 15px;
      color: #0077b6;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }
      button {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <h2>NIDS Prediction Form</h2>
  <form action="/predict" method="POST">
    <!-- Numeric fields -->
    <div>
      <label for="duration">Duration</label>
      <input type="number" step="any" name="duration" value="0">
    </div>
    <div>
      <label for="src_bytes">Source Bytes</label>
      <input type="number" step="any" name="src_bytes" value="181">
    </div>
    <div>
      <label for="dst_bytes">Destination Bytes</label>
      <input type="number" step="any" name="dst_bytes" value="5450">
    </div>

    <!-- Categorical fields -->
    <div>
      <label for="protocol_type">Protocol Type</label>
      <select name="protocol_type">
        <option value="tcp" selected>tcp</option>
        <option value="udp">udp</option>
        <option value="icmp">icmp</option>
      </select>
    </div>

    <div>
      <label for="service">Service</label>
      <select name="service">
        <option value="http" selected>http</option>
        <option value="ftp">ftp</option>
        <option value="smtp">smtp</option>
        <option value="domain_u">domain_u</option>
        <option value="eco_i">eco_i</option>
      </select>
    </div>

    <div>
      <label for="flag">Flag</label>
      <select name="flag">
        <option value="SF" selected>SF</option>
        <option value="S0">S0</option>
        <option value="REJ">REJ</option>
        <option value="RSTR">RSTR</option>
      </select>
    </div>

    <!-- More numeric fields -->
    <div>
      <label for="wrong_fragment">Wrong Fragment</label>
      <input type="number" step="any" name="wrong_fragment" value="0">
    </div>
    <div>
      <label for="urgent">Urgent</label>
      <input type="number" step="any" name="urgent" value="0">
    </div>
    <div>
      <label for="hot">Hot</label>
      <input type="number" step="any" name="hot" value="0">
    </div>
    <div>
      <label for="num_failed_logins">Num Failed Logins</label>
      <input type="number" step="any" name="num_failed_logins" value="0">
    </div>
    <div>
      <label for="logged_in">Logged In</label>
      <input type="number" step="any" name="logged_in" value="1">
    </div>
    <div>
      <label for="count">Count</label>
      <input type="number" step="any" name="count" value="2">
    </div>

    <!-- Submit button -->
    <button type="submit">Predict Attack Category</button>
  </form>

  <p>Prediction: {{prediction}}</p>
  <p>Label: {{label}}</p>
  <p>Confidence Score: </p>
  {% for score in confidence_score %}
    <p>{{score}}</p>
  {% endfor %}
</body>
</html>
